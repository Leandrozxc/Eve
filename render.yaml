services:
  - type: web
    name: eve-scheduling
    runtime: python
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "python manage.py migrate && python manage.py seed_demo_data && gunicorn eve_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///db.sqlite3

