{% extends 'base.html' %}

{% block title %}Create Your Eve Account{% endblock %}

{% block full_bleed %}
<section class="eve-auth-stage">
    <div class="eve-auth-box" style="max-width: 500px;">
        <div class="mb-4">
            <div class="eve-auth-logo" aria-hidden="true">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h1 class="apple-headline-tile mb-1">Create your Eve account</h1>
            <p class="apple-body mb-0">Set up your profile and launch your organization workspace.</p>
        </div>

        {% if error %}
        <div class="eve-alert eve-alert-danger mb-4" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'register:register' %}" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="full_name" class="eve-form-label">Full Name</label>
                <input
                    type="text"
                    class="form-control eve-input"
                    id="full_name"
                    name="full_name"
                    value="{{ full_name|default:'' }}"
                    placeholder="Alex Morgan"
                    autocomplete="name"
                    required
                    autofocus
                >
            </div>

            <div class="mb-3">
                <label for="email" class="eve-form-label">Work Email Address</label>
                <input
                    type="email"
                    class="form-control eve-input"
                    id="email"
                    name="email"
                    value="{{ email|default:'' }}"
                    placeholder="alex@organization.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="company" class="eve-form-label">Organization Name</label>
                <input
                    type="text"
                    class="form-control eve-input"
                    id="company"
                    name="company"
                    value="{{ company|default:'' }}"
                    placeholder="Apex Event Productions"
                    autocomplete="organization"
                    required
                >
            </div>

            <div class="row g-3 mb-4">
                <div class="col-sm-6">
                    <label for="password" class="eve-form-label">Password</label>
                    <input
                        type="password"
                        class="form-control eve-input"
                        id="password"
                        name="password"
                        placeholder="Create password"
                        autocomplete="new-password"
                        required
                    >
                </div>
                <div class="col-sm-6">
                    <label for="confirm_password" class="eve-form-label">Confirm Password</label>
                    <input
                        type="password"
                        class="form-control eve-input"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Repeat password"
                        autocomplete="new-password"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn-apple-primary btn-apple-lg w-100">
                Create Workspace Account
            </button>
        </form>

        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 apple-divider-top">
            <span class="apple-caption">Already have an account?</span>
            <a href="{% url 'login:login' %}" class="apple-link-cta apple-link-cta-sm">
                Sign in <span class="chevron" aria-hidden="true">&rarr;</span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
