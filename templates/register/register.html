{% extends 'base.html' %}

{% block title %}Create Your Eve Account{% endblock %}

{% block full_bleed %}
<section class="d-flex align-items-center justify-content-center py-5 px-3" style="min-height: calc(100vh - var(--eve-topbar-height));">
    <div class="eve-panel w-100" style="max-width: 480px;">
        <div class="eve-panel-body p-4 p-sm-5">
            <div class="mb-4">
                <span class="eve-sidebar-brand-mark mb-3" style="width: 38px; height: 38px; font-size: 18px;" aria-hidden="true">
                    <i class="bi bi-person-plus-fill"></i>
                </span>
                <h1 class="h4 fw-bold mb-1" style="letter-spacing: -0.02em;">Create your Eve account</h1>
                <p class="mb-0" style="font-size: 13.5px; color: var(--eve-text-secondary);">Set up your profile and launch your organization workspace.</p>
            </div>

            {% if error %}
            <div class="eve-flash-item eve-flash-danger mb-3" role="alert">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                    <span>{{ error }}</span>
                </div>
            </div>
            {% endif %}

            <form method="POST" action="{% url 'register:register' %}" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="full_name" class="form-label fw-semibold" style="font-size: 13px;">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" value="{{ full_name|default:'' }}" placeholder="Alex Morgan" autocomplete="name" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold" style="font-size: 13px;">Work Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email|default:'' }}" placeholder="alex@organization.com" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label for="company" class="form-label fw-semibold" style="font-size: 13px;">Organization Name</label>
                    <input type="text" class="form-control" id="company" name="company" value="{{ company|default:'' }}" placeholder="Apex Event Productions" autocomplete="organization" required>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <label for="password" class="form-label fw-semibold" style="font-size: 13px;">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create password" autocomplete="new-password" required>
                    </div>
                    <div class="col-sm-6">
                        <label for="confirm_password" class="form-label fw-semibold" style="font-size: 13px;">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat password" autocomplete="new-password" required>
                    </div>
                </div>
                <button type="submit" class="eve-btn eve-btn-primary w-100 py-2">Create Workspace Account</button>
            </form>

            <div class="d-flex justify-content-between align-items-center mt-4 pt-3" style="border-top: 1px solid var(--eve-border); font-size: 13px;">
                <span style="color: var(--eve-text-muted);">Already have an account?</span>
                <a href="{% url 'login:login' %}" class="fw-semibold text-decoration-none" style="color: var(--eve-accent-text);">Sign in &rarr;</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
