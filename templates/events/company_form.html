{% extends "base.html" %}

{% block title %}Create Organization{% endblock %}

{% block full_bleed %}
<div style="max-width: 640px; margin: 0 auto;">
    <div class="eve-page-header">
        <div>
            <div class="eve-page-eyebrow">New Workspace</div>
            <h1 class="eve-page-title">Create an Organization</h1>
            <p class="eve-page-subtitle">Set up your workspace directory. Your account will automatically receive <strong>Owner</strong> permissions.</p>
        </div>
        <div class="eve-page-actions">
            <a href="{% url 'events:company_list' %}" class="eve-btn eve-btn-secondary eve-btn-sm">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                <span>Cancel</span>
            </a>
        </div>
    </div>

    <div class="eve-panel">
        <div class="eve-panel-body">
            <form method="post" action="{% url 'events:company_create' %}" class="d-flex flex-column gap-3">
                {% csrf_token %}

                <div>
                    <label for="name" class="form-label fw-semibold" style="font-size: 13px;">Organization Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Apex Event Solutions, Studio Live" required autofocus>
                </div>

                <div>
                    <label for="contact_number" class="form-label fw-semibold" style="font-size: 13px;">Dispatch or Contact Phone</label>
                    <input type="text" class="form-control eve-mono" id="contact_number" name="contact_number" placeholder="e.g. +63 900 123 4567">
                </div>

                <div>
                    <label for="address" class="form-label fw-semibold" style="font-size: 13px;">Headquarters / Primary Address</label>
                    <input type="text" class="form-control" id="address" name="address" placeholder="e.g. 100 Ayala Avenue, Makati City">
                </div>

                <div class="d-flex justify-content-end align-items-center gap-2 pt-3 mt-2" style="border-top: 1px solid var(--eve-border);">
                    <a href="{% url 'events:company_list' %}" class="eve-btn eve-btn-secondary">Cancel</a>
                    <button type="submit" class="eve-btn eve-btn-primary">
                        <i class="bi bi-check-lg" aria-hidden="true"></i>
                        <span>Create Organization</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
