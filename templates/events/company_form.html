{% extends "base.html" %}

{% block title %}Create Organization{% endblock %}

{% block full_bleed %}
<section class="apple-section-canvas">
    <div class="apple-container" style="max-width: 640px;">
        <div class="eve-workspace-header mb-4">
            <div>
                <h1 class="apple-headline-section mb-1">Create an organization</h1>
                <p class="apple-body mb-0">
                    Set up your workspace directory. Your account will automatically receive <strong>Owner</strong> permissions.
                </p>
            </div>
            <a href="{% url 'events:company_list' %}" class="btn-apple-secondary btn-apple-sm">
                Cancel
            </a>
        </div>

        <div class="apple-tile">
            <form method="post" action="{% url 'events:company_create' %}">
                {% csrf_token %}

                <div class="mb-4">
                    <label for="name" class="eve-form-label">Organization Name</label>
                    <input type="text" class="form-control eve-input" id="name" name="name" placeholder="e.g. Apex Event Solutions, Studio Live" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="contact_number" class="eve-form-label">Dispatch or Contact Phone</label>
                    <input type="text" class="form-control eve-input tabular-nums" id="contact_number" name="contact_number" placeholder="e.g. +63 900 123 4567">
                </div>

                <div class="mb-4">
                    <label for="address" class="eve-form-label">Headquarters / Primary Address</label>
                    <input type="text" class="form-control eve-input" id="address" name="address" placeholder="e.g. 100 Ayala Avenue, Makati City">
                </div>

                <div class="d-flex justify-content-end align-items-center gap-3 pt-4 apple-divider-top">
                    <a href="{% url 'events:company_list' %}" class="btn-apple-secondary">Cancel</a>
                    <button type="submit" class="btn-apple-primary">
                        Create Organization
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
