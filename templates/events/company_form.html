{% extends "base.html" %}

{% block title %}Create Organization{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <div class="text-uppercase fw-semibold small mb-1" style="color: var(--apple-text-secondary); letter-spacing: 0.05em; font-size: 0.75rem;">
                    Organization Setup
                </div>
                <h1 class="eve-hero-title mb-1" style="font-size: 2.25rem;">Create Organization</h1>
                <p class="eve-hero-subtitle mb-0">Set up your company. You will automatically receive the <strong>Owner</strong> role.</p>
            </div>
            <a href="{% url 'events:company_list' %}" class="btn eve-btn-outline btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Cancel
            </a>
        </div>

        <div class="card eve-bento-card">
            <div class="card-body p-4 p-md-5">
                <form method="post" action="{% url 'events:company_create' %}">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label for="name" class="form-label">Organization Name *</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Apex Event Solutions, Beacon Media" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="contact_number" class="form-label">Contact Phone Number</label>
                        <input type="text" class="form-control" id="contact_number" name="contact_number" placeholder="e.g. +63 900 123 4567">
                    </div>

                    <div class="mb-4">
                        <label for="address" class="form-label">Headquarters / Office Address</label>
                        <input type="text" class="form-control" id="address" name="address" placeholder="e.g. 100 Ayala Avenue, Makati City">
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3" style="border-top: 1px solid var(--apple-border);">
                        <a href="{% url 'events:company_list' %}" class="btn eve-btn-outline">Cancel</a>
                        <button type="submit" class="btn eve-btn-primary">
                            Create & Set as Owner
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
