{% extends "base.html" %}

{% block title %}Create Company{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h2 mb-1">Create a Company</h1>
                <p class="text-muted mb-0">Set up an organization. You will automatically become the <strong>Owner</strong>.</p>
            </div>
            <a href="{% url 'events:company_list' %}" class="btn eve-btn-outline">
                <i class="bi bi-arrow-left me-1"></i> Back to Companies
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <form method="post" action="{% url 'events:company_create' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Company / Organization Name *</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g., Summit Event Productions, TechCon Inc." required>
                    </div>

                    <div class="mb-3">
                        <label for="contact_number" class="form-label fw-semibold">Contact Number</label>
                        <input type="text" class="form-control" id="contact_number" name="contact_number" placeholder="e.g., +63 912 345 6789">
                    </div>

                    <div class="mb-4">
                        <label for="address" class="form-label fw-semibold">Office Address / Headquarters</label>
                        <input type="text" class="form-control" id="address" name="address" placeholder="e.g., Makati City, Metro Manila">
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="{% url 'events:company_list' %}" class="btn eve-btn-outline">Cancel</a>
                        <button type="submit" class="btn eve-btn-primary">Create Company & Set as Owner</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
