{% extends "base.html" %}

{% block title %}Create Event / Shift{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h2 mb-1">Create Event under Company</h1>
                <p class="text-muted mb-0">Schedule an event and prepare shift assignments for company members.</p>
            </div>
            <a href="{% url 'events:event_list' %}" class="btn eve-btn-outline">
                <i class="bi bi-arrow-left me-1"></i> Back to Events
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <form method="post" action="{% url 'events:event_create' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="company_id" class="form-label fw-semibold">Company *</label>
                        <select class="form-select" id="company_id" name="company_id" required>
                            {% for mem in memberships %}
                                <option value="{{ mem.company.id }}">
                                    {{ mem.company.name }} (Your Role: {{ mem.get_role_display }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Event Title *</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="e.g., Annual Tech Expo, Weekend Night Shift" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Shift duties, briefing instructions, or overview..."></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="event_date" class="form-label fw-semibold">Event Date *</label>
                            <input type="date" class="form-control" id="event_date" name="event_date" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="start_time" class="form-label fw-semibold">Start Time *</label>
                            <input type="time" class="form-control" id="start_time" name="start_time" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="end_time" class="form-label fw-semibold">End Time *</label>
                            <input type="time" class="form-control" id="end_time" name="end_time" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label for="location" class="form-label fw-semibold">Location / Venue *</label>
                            <input type="text" class="form-control" id="location" name="location" placeholder="e.g., City Arena, Convention Center Hall B" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="status" class="form-label fw-semibold">Initial Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="UPCOMING" selected>Upcoming</option>
                                <option value="DRAFT">Draft</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="CANCELLED">Cancelled</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{% url 'events:event_list' %}" class="btn eve-btn-outline">Cancel</a>
                        <button type="submit" class="btn eve-btn-primary">Create Event & Proceed to Assignments</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
