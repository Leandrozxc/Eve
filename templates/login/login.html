{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="eve-auth-wrapper">
    <div class="card eve-auth-card">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <span class="eve-logo-circle eve-logo-large">E</span>
                <h2 class="eve-brand-title mt-3">Eve</h2>
                <p class="eve-tagline">Smart scheduling for teams that keep things moving.</p>
            </div>

            <form method="post" action="{% url 'login:login' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="you@company.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn eve-btn-primary w-100 mt-2">Login</button>
            </form>

            <p class="text-center mt-4 mb-0 eve-switch-link">
                Do not have an account?
                <a href="{% url 'accounts:register' %}">Register</a>
            </p>

        </div>
    </div>
</div>
{% endblock %}
